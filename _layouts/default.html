<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }} – {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
      <p class="site-description">{{ site.tagline }}</p>
      <nav class="site-nav" aria-label="Main">
        <ul>
          {%- for item in site.menu %}
          <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
          {%- endfor %}
        </ul>
      </nav>
    </header>

    <main>
      {%- if page.title %}
      <h1 class="entry-title">{{ page.title }}</h1>
      {%- endif %}
      {{ content }}
    </main>

    <footer class="site-footer">&copy; {{ site.time | date: '%Y' }} {{ site.title }}</footer>
  </div>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ab50590519eb484cad672ea50a602094"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
