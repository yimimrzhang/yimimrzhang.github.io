# Courses shown on the Teaching page.
#
# Newest term goes at the TOP. The top term of the first school is highlighted
# automatically as the current term.
#
# Each course has:
#   code:  course number (optional)
#   title: course name
#   link:  web address (optional; makes the course name a link)
#
# To add a new term, copy this block, paste it under "terms:" above the
# current top term, and change the details (keep the indentation the same):
#
#     - term: Spring 2027
#       courses:
#         - code: STAT 8406
#           title: Regression Methods
#           link: https://brightspace.villanova.edu/d2l/home/12345

